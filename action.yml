name: Setup Terraform
description: Installs Terraform of a specified version
inputs:
  version:
    required: true
    description: Terraform version to install
runs:
  using: composite
  steps:
    - name: Download Terraform
      shell: bash
      run: |
        wget https://releases.hashicorp.com/terraform/${{ inputs.version }}/terraform_${{ inputs.version }}_linux_amd64.zip -O terraform.zip
        unzip terraform.zip
        sudo mv terraform /usr/local/bin/
        rm terraform.zip

    - name: Verify Terraform
      shell: bash
      run: terraform -v